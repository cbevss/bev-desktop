<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>BEV | Can't connect</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#04060C;color:#E8EEFF;font:16px/1.55 'Segoe UI',system-ui,sans-serif}
main{max-width:440px;padding:32px;text-align:center}
img{width:88px;height:88px;border-radius:20px;box-shadow:0 0 40px rgba(37,99,235,.55)}
h1{margin:22px 0 8px;font-size:24px;color:#fff}
p{margin:0 0 22px;color:#97A4CB}
button{min-height:46px;padding:0 26px;border:1px solid #7FA6FF;border-radius:999px;background:#2563EB;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{box-shadow:0 0 24px rgba(37,99,235,.55)}
button:focus-visible{outline:2px solid #7FA6FF;outline-offset:3px}
small{display:block;margin-top:18px;color:#97A4CB;font-size:13.5px}
</style>
</head>
<body>
<main>
<img src="build/icon.png" alt="">
<h1>Can't reach BEV</h1>
<p>Check your internet connection. BEV will try again by itself when you're back online.</p>
<button id="retry" type="button">Try again</button>
<small>If your internet is working, the website may be down for a moment.</small>
</main>
<script>
(function () {
  var target = 'https://bevbotdiscord.com/dashboard';
  try {
    var asked = new URLSearchParams(location.search).get('url') || '';
    var u = new URL(asked);
    if (u.protocol === 'https:' && (u.hostname === 'bevbotdiscord.com' || u.hostname === 'www.bevbotdiscord.com')) target = u.href;
  } catch (e) { /* keep the dashboard */ }
  function go() { location.href = target; }
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
})();
</script>
</body>
</html>
